<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>像素冒险</title>
<style>
:root{color-scheme:dark;font-family:system-ui,sans-serif}*{box-sizing:border-box}html,body{margin:0;min-height:100%;background:#101522;color:#fff;touch-action:manipulation}body{min-height:100dvh}button{color:inherit;font:inherit}.screen{display:none;position:fixed;inset:0;overflow:auto}.screen.active{display:flex;flex-direction:column}.center{flex:1;min-height:100%;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:24px;text-align:center}#title{background:radial-gradient(ellipse at 50% 30%,#315c78,#101522 70%)}h1{margin:0 0 8px;color:#ffd84a;font-size:clamp(32px,8vw,56px);letter-spacing:3px;text-shadow:3px 4px #713d28}h2{margin:0 0 12px}.subtitle{color:#c9d8e8;margin:0 0 20px}.btn{border:2px solid #7990a8;border-radius:10px;background:#26364a;padding:12px 20px;margin:5px;min-width:150px;cursor:pointer;box-shadow:0 4px #111a26}.btn:hover,.btn:focus-visible{background:#38536e}.btn:active{transform:translateY(2px);box-shadow:0 2px #111a26}.grid{display:grid;grid-template-columns:repeat(4,minmax(58px,72px));gap:9px;margin:14px 0}.cell{min-height:64px;border:2px solid #52677e;border-radius:10px;background:#1d2c3d;font-size:30px;cursor:pointer}.cell:disabled{opacity:.45;cursor:not-allowed}.note{max-width:440px;color:#bdc9d5;font-size:14px;line-height:1.5}#shop .center{overflow:auto}#char{width:140px;height:190px;background:#111;border:2px solid #52677e;border-radius:8px;image-rendering:pixelated}#goldText{margin:8px;color:#ffd84a}#saveStatus{min-height:21px;color:#bdc9d5;font-size:13px}#play{background:#101522}.top{min-height:46px;display:flex;align-items:center;justify-content:space-between;gap:8px;padding:7px 12px;background:#172131;font-size:14px}.top .btn{min-width:auto;margin:0;padding:6px 10px;font-size:13px}#game{display:block;width:100%;height:auto;max-height:62vh;background:#83d6f4;image-rendering:pixelated}#message{min-height:26px;padding:4px 10px;color:#ffe083;text-align:center;font-size:14px}.pad{flex:1;min-height:100px;display:flex;justify-content:space-between;align-items:flex-end;padding:8px max(16px,env(safe-area-inset-right)) max(12px,env(safe-area-inset-bottom)) max(16px,env(safe-area-inset-left))}.left,.right{display:flex;gap:12px}.key{width:68px;height:68px;display:grid;place-items:center;border:2px solid #637b94;border-radius:14px;background:#26364a;font-size:28px;user-select:none;touch-action:none;cursor:pointer}.key.jump{width:84px;height:84px;font-size:20px}.key.pressed{background:#55718e}@media(min-width:800px){.pad{max-width:960px;width:100%;align-self:center}#game{max-height:58vh;object-fit:contain}}
</style>
</head>
<body>
<div id="title" class="screen active"><div class="center"><h1>像素冒险</h1><p class="subtitle">收集金币，躲开怪物，抵达终点！</p><button class="btn" onclick="go('map')">开始冒险</button><button class="btn" onclick="go('shop')">角色换装</button><button class="btn" onclick="saveProgress(true)">保存进度</button><p id="saveStatus" aria-live="polite"></p><p class="note">电脑：方向键移动，空格跳跃。手机：使用屏幕下方的方向键和跳跃键。</p></div></div>
<div id="map" class="screen"><div class="center"><h2>选择关卡</h2><div class="grid" id="mapGrid"></div><p class="note">碰到每关终点旗帜即可通关并自动进入下一关。通关进度会保存在此设备。</p><button class="btn" onclick="saveProgress(true)">保存进度</button></div></div>
<div id="shop" class="screen"><div class="center"><h2>角色换装</h2><canvas id="char" width="160" height="220"></canvas><div id="goldText"></div><button class="btn" onclick="change(0)">更换衣服（3金币）</button><button class="btn" onclick="change(1)">更换头发（3金币）</button><button class="btn" onclick="change(2)">更换武器（3金币）</button><button class="btn" onclick="go('map')">返回关卡</button></div></div>
<div id="play" class="screen"><div class="top"><div id="hearts" aria-label="生命值">❤️❤️❤️</div><strong id="levelTitle">青草平原</strong><div>🪙 <span id="coinUI">0</span>　<span id="goldUI">金币 4</span></div><button class="btn" onclick="go('title')" aria-label="回到主页">回主页</button></div><canvas id="game" width="960" height="360" aria-label="横版冒险游戏画面"></canvas><div id="message">收集金币并碰到终点旗帜通关！</div><div class="pad"><div class="left"><button class="key" id="kL" aria-label="向左">◀</button><button class="key" id="kR" aria-label="向右">▶</button></div><button class="key jump" id="kJ" aria-label="跳跃">跳跃</button></div></div>
<script>
'use strict';
const SAVE_KEY='pixel-adventure-save-v1';
const LEVELS=[
 {name:'青草平原',width:1800,platforms:[[0,320,1800,40],[270,260,130,16],[520,220,150,16],[790,270,150,16],[1080,225,150,16],[1370,260,150,16]],enemies:[[360,310,310,470,1.3],[900,850,1010,-1.5],[1450,1400,1570,1.6]],coins:[[180,278],[315,222],[455,278],[565,182],[710,278],[830,232],[1010,278],[1120,187],[1290,278],[1415,222],[1580,278],[1710,278]]},
 {name:'蘑菇森林',width:1950,platforms:[[0,320,1950,40],[220,270,140,16],[465,220,150,16],[730,260,145,16],[990,205,160,16],[1270,255,150,16],[1540,215,145,16]],enemies:[[340,290,245,430,1.7],[820,770,930,-1.8],[1370,1310,1480,2],[1690,1640,1800,-1.7],[1080,1010,1160,1.25,'bird']],coins:[[160,278],[280,232],[500,182],[655,278],[800,222],[930,278],[1050,167],[1210,278],[1360,217],[1510,278],[1660,177],[1850,278]]},
 {name:'火山山谷',width:2100,platforms:[[0,320,2100,40],[250,255,130,16],[490,205,145,16],[760,255,150,16],[1030,195,150,16],[1300,250,150,16],[1570,205,155,16],[1830,260,130,16]],enemies:[[370,330,280,450,1.8],[890,830,960,-2],[1430,1370,1510,2.1],[1770,1710,1880,-2]],coins:[[170,278],[300,217],[540,167],[680,278],[820,217],[970,278],[1080,157],[1230,278],[1370,212],[1530,278],[1660,167],[1810,222],[1980,278]]}
];
const defaults={gold:4,equip:{cloth:0,hair:0,weapon:0},currentLevel:1,clearedLevels:[]};
let save=loadSave(),p=null,enemies=[],fireballs=[],coins=[],platforms=[],worldWidth=LEVELS[0].width,flagTrigger=null,levelNumber=1,keys={l:false,r:false},cameraX=0,lastFrame=0,gameActive=false,invulnerable=0,runCoins=0,levelFinished=false;
const GROUND_Y=320,cv=document.getElementById('game'),ctx=cv.getContext('2d');
function loadSave(){try{const s=JSON.parse(localStorage.getItem(SAVE_KEY)||'null');if(!s||typeof s!=='object')return {...defaults,equip:{...defaults.equip},clearedLevels:[]};const cleared=Array.isArray(s.clearedLevels)?s.clearedLevels.map(id=>id==='meadow-1'?1:id).filter(id=>Number.isInteger(id)&&id>=1&&id<=LEVELS.length):[];const lvl=Number.isInteger(s.currentLevel)?s.currentLevel:(cleared.includes(1)?2:1);return {gold:Number.isFinite(s.gold)?Math.max(0,s.gold):defaults.gold,equip:{cloth:Number.isInteger(s.equip?.cloth)?((s.equip.cloth%3)+3)%3:0,hair:Number.isInteger(s.equip?.hair)?((s.equip.hair%3)+3)%3:0,weapon:Number.isInteger(s.equip?.weapon)?((s.equip.weapon%3)+3)%3:0},currentLevel:Math.max(1,Math.min(LEVELS.length,lvl)),clearedLevels:[...new Set(cleared)]}}catch(_){return {...defaults,equip:{...defaults.equip},clearedLevels:[]}}}
function saveProgress(showStatus=false){let ok=false;try{localStorage.setItem(SAVE_KEY,JSON.stringify(save));ok=true}catch(_){}updateGoldUI();const el=document.getElementById('saveStatus');if(el&&showStatus)el.textContent=ok?'进度已保存到此设备。':'保存失败：浏览器存储不可用。';return ok}
function go(id){if(id!=='play')gameActive=false;document.querySelectorAll('.screen').forEach(s=>s.classList.remove('active'));document.getElementById(id).classList.add('active');keys.l=keys.r=false;document.querySelectorAll('.key').forEach(k=>k.classList.remove('pressed'));if(id==='map')renderMap();if(id==='shop'){drawChar();updateShop()}if(id==='play')startLevel(save.currentLevel)}
function renderMap(){const grid=document.getElementById('mapGrid');grid.replaceChildren();LEVELS.forEach((level,i)=>{const n=i+1,unlocked=n<=save.currentLevel||save.clearedLevels.includes(n),b=document.createElement('button');b.className='cell';b.textContent=save.clearedLevels.includes(n)?'✅':unlocked?'🌿':'🔒';b.title=`第${n}关：${level.name}`;b.setAttribute('aria-label',b.title);b.disabled=!unlocked;b.onclick=()=>{save.currentLevel=n;saveProgress();go('play')};grid.appendChild(b)});const shop=document.createElement('button');shop.className='cell';shop.textContent='🏠';shop.title='换装商店';shop.setAttribute('aria-label','换装商店');shop.onclick=()=>go('shop');grid.appendChild(shop)}
function drawChar(){const c=document.getElementById('char').getContext('2d');c.clearRect(0,0,160,220);c.fillStyle='#e9b786';c.fillRect(56,68,48,48);c.fillStyle=['#fa0','#08f','#f3f'][save.equip.cloth];c.fillRect(48,116,64,66);c.fillStyle=['#34251e','#a33','#fc3'][save.equip.hair];c.fillRect(54,60,52,18);c.fillStyle='#222';c.fillRect(66,86,5,5);c.fillRect(89,86,5,5);c.fillStyle='#493425';c.fillRect(50,180,24,28);c.fillRect(86,180,24,28);c.fillStyle=['#ddd','#fc3','#f66'][save.equip.weapon];c.fillRect(116,125,8,48)}
function updateShop(){document.getElementById('goldText').textContent=`金币：${save.gold}`;updateGoldUI()}
function change(type){if(save.gold<3){document.getElementById('goldText').textContent='金币不足！请闯关赚取金币。';return}save.gold-=3;const key=['cloth','hair','weapon'][type];save.equip[key]=(save.equip[key]+1)%3;saveProgress();drawChar();updateShop()}
function updateGoldUI(){const e=document.getElementById('goldUI');if(e)e.textContent=`金币 ${save.gold}`}
function startLevel(number=save.currentLevel){levelNumber=Math.max(1,Math.min(LEVELS.length,number));save.currentLevel=levelNumber;const l=LEVELS[levelNumber-1];worldWidth=l.width;platforms=l.platforms.map(([x,y,w,h])=>({x,y,w,h}));flagTrigger={x:worldWidth-100,y:210,w:60,h:110};p={x:48,y:GROUND_Y-36,w:24,h:36,vx:0,vy:0,hp:3,onGround:true};enemies=l.enemies.map(([x,min,max,vx,type])=>({x,y:type==='bird'?150:GROUND_Y-24,w:type==='bird'?38:30,h:type==='bird'?28:24,min,max,vx,type:type||'slime',alive:true,fireTimer:1.2,phase:Math.random()*6}));fireballs=[];coins=l.coins.map(([x,y])=>({x,y,got:false}));cameraX=0;runCoins=0;invulnerable=0;levelFinished=false;const m=document.getElementById('message');m.onclick=null;m.textContent=`第 ${levelNumber} 关：收集金币并碰到旗帜通关！`;document.getElementById('levelTitle').textContent=`第 ${levelNumber} 关：${l.name}`;updateHUD();saveProgress();gameActive=true;lastFrame=0;requestAnimationFrame(gameLoop)}
function updateHUD(){document.getElementById('hearts').textContent='❤️'.repeat(Math.max(0,p?.hp??3))+'🖤'.repeat(3-Math.max(0,p?.hp??3));document.getElementById('coinUI').textContent=runCoins;updateGoldUI()}
function jump(){if(!gameActive||!p||levelFinished||!document.getElementById('play').classList.contains('active'))return;if(p.onGround){p.vy=-11.5;p.onGround=false}}
function overlap(a,b){return a.x<b.x+b.w&&a.x+a.w>b.x&&a.y<b.y+b.h&&a.y+a.h>b.y}
function damagePlayer(enemy){if(invulnerable>0)return;p.hp--;invulnerable=1.25;p.vx=p.x<enemy.x?-5:5;p.vy=-5;document.getElementById('message').textContent=p.hp>0?(enemy.type==='bird'?'被火焰鸟的火焰击中了！小心躲避。':'被史莱姆撞到了！小心躲避。'):'生命值耗尽，关卡失败。';updateHUD();if(p.hp<=0){gameActive=false;setTimeout(()=>{if(document.getElementById('play').classList.contains('active'))go('map')},1100)}}
function finishLevel(){if(levelFinished)return;levelFinished=true;gameActive=false;const n=levelNumber,reward=runCoins+5;save.gold+=reward;if(!save.clearedLevels.includes(n))save.clearedLevels.push(n);const next=n<LEVELS.length;if(next)save.currentLevel=n+1;saveProgress();updateHUD();const m=document.getElementById('message');m.textContent=next?`第 ${n} 关通关！获得 ${reward} 金币，即将进入第 ${n+1} 关……`:`恭喜通关全部关卡！获得 ${reward} 金币。点击这里返回地图。`;if(!next)m.onclick=()=>go('map');setTimeout(()=>{if(!document.getElementById('play').classList.contains('active'))return;if(next)startLevel(n+1);else go('map')},1500)}
function gameLoop(t){if(!gameActive)return;const dt=Math.min((t-(lastFrame||t))/16.67,2);lastFrame=t;if(!document.getElementById('play').classList.contains('active')){gameActive=false;return}if(invulnerable>0)invulnerable=Math.max(0,invulnerable-dt/60);const speed=3.7;if(keys.l&&!keys.r)p.vx=-speed;else if(keys.r&&!keys.l)p.vx=speed;else p.vx*=Math.pow(.78,dt);p.x=Math.max(0,Math.min(worldWidth-p.w,p.x+p.vx*dt));const prev=p.y+p.h;p.vy=Math.min(12,p.vy+.62*dt);p.y+=p.vy*dt;p.onGround=false;for(const q of platforms)if(p.vy>=0&&prev<=q.y+2&&p.y+p.h>=q.y&&p.x+p.w>q.x&&p.x<q.x+q.w){p.y=q.y-p.h;p.vy=0;p.onGround=true}if(p.y>cv.height+100){p.hp=0;updateHUD();gameActive=false;document.getElementById('message').textContent='掉出平台，关卡失败。';setTimeout(()=>{if(document.getElementById('play').classList.contains('active'))go('map')},1100);return}
 for(const e of enemies){if(!e.alive)continue;e.x+=e.vx*dt;if(e.x<e.min||e.x>e.max)e.vx*=-1;if(e.type==='bird'){e.phase+=dt*.08;e.y=145+Math.sin(e.phase)*20;e.fireTimer-=dt/60;if(e.fireTimer<=0){const dir=p.x<e.x?-1:1;fireballs.push({x:e.x+(dir<0?0:e.w),y:e.y+18,w:18,h:14,vx:dir*3.1,life:2.5});e.fireTimer=1.6}}if(overlap(p,e)){if(p.vy>1&&p.y+p.h-e.y<17){e.alive=false;p.vy=-8}else damagePlayer(e)}}
 for(const f of fireballs){f.x+=f.vx*dt;f.life-=dt/60;if(overlap(p,f)){damagePlayer({x:f.x,type:'bird'});f.life=0}}fireballs=fireballs.filter(f=>f.life>0&&f.x>-cameraX-100&&f.x<worldWidth+100);for(const c of coins)if(!c.got&&overlap(p,{x:c.x-9,y:c.y-9,w:18,h:18})){c.got=true;runCoins++;updateHUD();document.getElementById('message').textContent='金币 +1！继续前进，找到终点旗帜。'}cameraX=Math.max(0,Math.min(worldWidth-cv.width,p.x-cv.width*.38));drawGame();if(p.hp>0&&overlap(p,flagTrigger)){finishLevel();drawGame();return}if(gameActive)requestAnimationFrame(gameLoop)}
function drawGame(){ctx.clearRect(0,0,cv.width,cv.height);const sky=ctx.createLinearGradient(0,0,0,cv.height);sky.addColorStop(0,'#74c9f0');sky.addColorStop(1,'#d4f4ff');ctx.fillStyle=sky;ctx.fillRect(0,0,cv.width,cv.height);ctx.fillStyle='#9bd28b';for(let i=0;i<7;i++){const x=i*230-(cameraX*.22%230);ctx.beginPath();ctx.ellipse(x+80,260,145,90,0,Math.PI,0);ctx.fill()}ctx.save();ctx.translate(-cameraX,0);platforms.forEach((q,i)=>{ctx.fillStyle=i===0?'#75452e':'#8b5a36';ctx.fillRect(q.x,q.y,q.w,q.h);ctx.fillStyle='#39ad54';ctx.fillRect(q.x,q.y,q.w,7);ctx.fillStyle='#a06a3f';for(let x=q.x+14;x<q.x+q.w;x+=38)ctx.fillRect(x,q.y+13,16,5)});coins.forEach(c=>{if(c.got)return;ctx.fillStyle='#ffcb38';ctx.beginPath();ctx.ellipse(c.x,c.y,8,11,0,0,Math.PI*2);ctx.fill();ctx.fillStyle='#fff2a1';ctx.fillRect(c.x-2,c.y-6,3,7)});enemies.forEach(e=>{if(!e.alive)return;if(e.type==='bird'){ctx.fillStyle='#db5360';ctx.beginPath();ctx.ellipse(e.x+19,e.y+13,18,12,0,0,Math.PI*2);ctx.fill();ctx.fillStyle='#f6c344';ctx.beginPath();ctx.moveTo(e.x+34,e.y+10);ctx.lineTo(e.x+45,e.y+14);ctx.lineTo(e.x+34,e.y+18);ctx.fill();ctx.fillStyle='#fff';ctx.fillRect(e.x+25,e.y+7,4,4);ctx.fillStyle='#25202b';ctx.fillRect(e.x+27,e.y+8,2,2);ctx.fillStyle='#a93045';ctx.beginPath();ctx.ellipse(e.x+16,e.y+16,10,5,Math.sin(e.phase)*.5,0,Math.PI*2);ctx.fill()}else{ctx.fillStyle='#52d86a';ctx.beginPath();ctx.roundRect(e.x,e.y,e.w,e.h,[12,12,5,5]);ctx.fill();ctx.fillStyle='#173b23';ctx.fillRect(e.x+7,e.y+8,4,5);ctx.fillRect(e.x+20,e.y+8,4,5)}});fireballs.forEach(f=>{ctx.fillStyle='#ff5a22';ctx.beginPath();ctx.ellipse(f.x+9,f.y+7,10,7,0,0,Math.PI*2);ctx.fill();ctx.fillStyle='#ffd34d';ctx.beginPath();ctx.ellipse(f.x+8,f.y+7,5,4,0,0,Math.PI*2);ctx.fill()});ctx.fillStyle='#45302a';ctx.fillRect(worldWidth-95,220,6,100);ctx.fillStyle='#ffdf46';ctx.beginPath();ctx.moveTo(worldWidth-89,221);ctx.lineTo(worldWidth-42,238);ctx.lineTo(worldWidth-89,255);ctx.fill();if(invulnerable<=0||Math.floor(performance.now()/90)%2===0){ctx.fillStyle='#e9b786';ctx.fillRect(p.x+3,p.y,18,14);ctx.fillStyle=['#34251e','#a33','#fc3'][save.equip.hair];ctx.fillRect(p.x+2,p.y-2,20,7);ctx.fillStyle=['#fa0','#08f','#f3f'][save.equip.cloth];ctx.fillRect(p.x,p.y+14,p.w,18);ctx.fillStyle='#29364a';ctx.fillRect(p.x+2,p.y+32,8,4);ctx.fillRect(p.x+14,p.y+32,8,4);ctx.fillStyle='#17202c';ctx.fillRect(p.x+(p.vx<0?5:15),p.y+5,3,3)}ctx.restore()}
function bindHold(id,key){const b=document.getElementById(id);b.addEventListener('pointerdown',e=>{e.preventDefault();b.setPointerCapture(e.pointerId);keys[key]=true;b.classList.add('pressed')});const release=e=>{if(e)e.preventDefault();keys[key]=false;b.classList.remove('pressed')};b.addEventListener('pointerup',release);b.addEventListener('pointercancel',release);b.addEventListener('lostpointercapture',release)}bindHold('kL','l');bindHold('kR','r');const jb=document.getElementById('kJ');jb.addEventListener('pointerdown',e=>{e.preventDefault();jb.classList.add('pressed');jump()});['pointerup','pointercancel','lostpointercapture'].forEach(t=>jb.addEventListener(t,()=>jb.classList.remove('pressed')));window.addEventListener('keydown',e=>{if(e.key==='ArrowLeft'||e.key.toLowerCase()==='a'){keys.l=true;e.preventDefault()}if(e.key==='ArrowRight'||e.key.toLowerCase()==='d'){keys.r=true;e.preventDefault()}if(e.key===' '||e.key==='ArrowUp'||e.key.toLowerCase()==='w'){jump();e.preventDefault()}});window.addEventListener('keyup',e=>{if(e.key==='ArrowLeft'||e.key.toLowerCase()==='a')keys.l=false;if(e.key==='ArrowRight'||e.key.toLowerCase()==='d')keys.r=false});window.addEventListener('blur',()=>{keys.l=keys.r=false});updateGoldUI();if('serviceWorker'in navigator&&location.protocol!=='file:')navigator.serviceWorker.register('sw.js').catch(()=>{});
</script>
</body>
</html>
