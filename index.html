<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
<title>像素冒险 V25 横版</title>
<style>
  * { box-sizing: border-box; }
  html, body {
    margin: 0; height: 100%;
    background: #000; color: #fff;
    font-family: monospace; overflow: hidden;
    touch-action: none; user-select: none;
  }

  .screen { display: none; position: absolute; inset: 0; flex-direction: column; }
  .screen.active { display: flex; }

  h1 { font-size: 36px; color: gold; letter-spacing: 4px; }
  .btn {
    background: #222; border: 2px solid #555;
    padding: 14px 22px; margin: 6px; font-size: 18px;
    cursor: pointer; border-radius: 6px; text-align: center;
  }
  .btn:active { background: #444; }

  .center { flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; }

  /* 横版 */
  #play { background: #000; }
  #game {
    width: 100%; height: 62vh;
    image-rendering: pixelated;
    background: #87ceeb;
    border-bottom: 2px solid #333;
  }
  .top {
    display: flex; justify-content: space-between;
    padding: 8px 12px; background: #111; font-size: 16px;
  }
  .pad {
    flex: 1; display: flex; justify-content: space-between;
    align-items: flex-end; padding: 12px 18px;
  }
  .left, .right { display: flex; gap: 12px; }
  .key {
    width: 76px; height: 76px; background: #222;
    border: 2px solid #555; border-radius: 10px;
    display: flex; align-items: center; justify-content: center;
    font-size: 30px;
  }
  .jump { width: 96px; height: 96px; font-size: 22px; }

  .grid { display: grid; grid-template-columns: repeat(4, 64px); gap: 8px; margin-top: 10px; }
  .cell { width: 64px; height: 64px; background: #222; font-size: 30px; display: flex; align-items: center; justify-content: center; }
</style>
</head>

<body>

<!-- 标题 -->
<div id="title" class="screen active">
  <div class="center">
    <h1>像素冒险 V25</h1>
    <div class="btn" onclick="go('map')">开始游戏</div>
    <div class="btn" onclick="go('shop')">商店换装</div>
  </div>
</div>

<!-- 地图 -->
<div id="map" class="screen">
  <div class="center">
    <h2>选择区域</h2>
    <div class="grid" id="mapGrid"></div>
    <div class="btn" onclick="go('title')">返回</div>
  </div>
</div>

<!-- 商店 -->
<div id="shop" class="screen">
  <div class="center">
    <h2>换装</h2>
    <canvas id="char" width="160" height="220" style="background:#000"></canvas>
    <div class="btn" onclick="change(0)">衣服</div>
    <div class="btn" onclick="change(1)">头发</div>
    <div class="btn" onclick="change(2)">武器</div>
    <div id="goldText"></div>
    <div class="btn" onclick="go('title')">返回</div>
  </div>
</div>

<!-- 战斗 -->
<div id="battle" class="screen">
  <div class="center">
    <h2>战斗</h2>
    <div id="enemyHp" style="font-size:24px">HP 30 / 30</div>
    <div class="btn" onclick="atk()">攻击</div>
    <div class="btn" onclick="go('map')">逃跑</div>
  </div>
</div>

<!-- 横版 -->
<div id="play" class="screen">
  <div class="top">
    <div id="hearts">❤️❤️❤️</div>
    <div>青草平原</div>
    <div>金币 <span id="coinUI">0</span></div>
  </div>
  <canvas id="game" width="960" height="360"></canvas>
  <div class="pad">
    <div class="left">
      <div class="key" id="kL">◀</div>
      <div class="key" id="kR">▶</div>
    </div>
    <div class="right">
      <div class="key jump" id="kJ">跳</div>
    </div>
  </div>
</div>

<script>
/* ========== 状态 ========== */
let save = { gold: 4, coins: 0, hp: 3, equip: { cloth:0, hair:0, weapon:0 } };
let enemyHp = 30;

function go(id){
  document.querySelectorAll('.screen').forEach(s=>s.classList.remove('active'));
  document.getElementById(id).classList.add('active');
  if(id==='map') renderMap();
  if(id==='shop'){ drawChar(); goldText.textContent = '金币: '+save.gold; }
  if(id==='play') startLevel();
}

/* ========== 地图 ========== */
function renderMap(){
  const g = document.getElementById('mapGrid');
  g.innerHTML = '';
  const cells = ['🌲','🏔','🕳','👹','💎','🏠','⚔','❓'];
  cells.forEach(t=>{
    const c = document.createElement('div');
    c.className = 'cell'; c.textContent = t;
    c.onclick = ()=>{
      if(t==='👹'||t==='⚔'){ enemyHp=30; enemyHpEl(); go('battle'); }
      else if(t==='💎'){ save.gold+=5; renderMap(); }
      else { save.hp=3; save.coins=0; go('play'); }
    };
    g.appendChild(c);
  });
}

/* ========== 战斗 ========== */
function enemyHpEl(){ document.getElementById('enemyHp').textContent = 'HP '+enemyHp+' / 30'; }
function atk(){
  enemyHp -= Math.ceil(Math.random() * 8+4);
  if(enemyHp<=0){ save.gold+=20; enemyHp=30; enemyHpEl(); alert('胜利！+20金币'); go('map'); }
  else enemyHpEl();
}

/* ========== 商店 ========== */
function drawChar(){
  const c = document.getElementById('char').getContext('2d');
  c.clearRect(0,0,160,220);
  c.fillStyle = ['#fa0','#08f','#f3f'][save.equip.cloth];
  c.fillRect(56,110,48,60);
  c.fillStyle = ['#000','#a33','#fc3'][save.equip.hair];
  c.fillRect(56,98,48,16);
}
function change(t){
  save.equip.cloth = t===0 ? (save.equip.cloth+1)%3 : save.equip.cloth;
  save.equip.hair = t===1 ? (save.equip.hair+1)%3 : save.equip.hair;
  save.equip.weapon = t===2 ? (save.equip.weapon+1)%3 : save.equip.weapon;
  drawChar();
}

/* ========== 横版 ========== */
const cv = document.getElementById('game');
const ctx = cv.getContext('2d');
let p, enemies, coins, keys = {}, running = false;

function startLevel(){
  p = { x:60, y:280, w:24, h:36, vx:0, vy:0, onG:true };
  enemies = [
    { x:300, y:300, w:28, h:24, vx:1.2, t:'slime' },
    { x:600, y:120, w:28, h:20, vx:-1.6, t:'bat' }
  ];
  coins = [];
  for(let i=0;i<6;i++) coins.push({ x:160+i * 130, y:240+Math.random() * 40, got:false });
  save.hp = 3; updateHUD();
  if(!running){ running=true; loop(); }
}

function updateHUD(){
  document.getElementById('hearts').textContent = '❤️'.repeat(save.hp) + '🖤'.repeat(3-save.hp);
  document.getElementById('coinUI').textContent = save.coins;
}

function loop(){
  if(!document.getElementById('play').classList.contains('active')){ requestAnimationFrame(loop); return; }

  // 输入
  if(keys.l) p.vx = -3.2;
  else if(keys.r) p.vx = 3.2;
  else p.vx *= 0.82;

  p.x += p.vx;
  p.vy += 0.65;
  p.y += p.vy;
  if(p.y >= 300){ p.y=300; p.vy=0; p.onG=true; }
  if(p.x<0) p.x=0;
  if(p.x>cv.width-p.w) p.x=cv.width-p.w;

  // 敌人
  enemies.forEach(e=>{
    e.x += e.vx;
    if(e.x<40||e.x>cv.width-40) e.vx*=-1;
    if(e.t==='bat') e.y = 120 + Math.sin(Date.now()/200) * 30;

    if(Math.abs(e.x-p.x)<22 && Math.abs(e.y-p.y)<30){
      save.hp--; updateHUD(); p.x=60; p.y=280;
      if(save.hp<=0){ alert('游戏结束'); save.gold+=save.coins; go('map'); }
    }
  });

  // 金币
  coins.forEach(c=>{
    if(!c.got && Math.abs(c.x-p.x)<26 && Math.abs(c.y-p.y)<34){
      c.got=true; save.coins++; updateHUD();
      if(save.coins>=6){ save.gold+=6; alert('通关青草平原！+6金币'); go('map'); }
    }
  });

  // 画
  ctx.fillStyle='#87ceeb'; ctx.fillRect(0,0,cv.width,120);
  ctx.fillStyle='#bfe9ff'; ctx.fillRect(0,120,cv.width,140);
  ctx.fillStyle='#5c4033'; ctx.fillRect(0,320,cv.width,40);
  ctx.fillStyle='#2ecc71'; ctx.fillRect(0,312,cv.width,10);

  coins.forEach(c=>{ if(!c.got){ ctx.fillStyle='gold'; ctx.beginPath(); ctx.arc(c.x,c.y,8,0,7); ctx.fill(); } });

  enemies.forEach(e=>{
    ctx.fillStyle = e.t==='slime' ? '#6f6' : '#a6f';
    ctx.fillRect(e.x, e.y, e.w, e.h);
  });

  ctx.fillStyle = ['#fa0','#08f','#f3f'][save.equip.cloth];
  ctx.fillRect(p.x, p.y, p.w, p.h);
  ctx.fillStyle = ['#000','#a33','#fc3'][save.equip.hair];
  ctx.fillRect(p.x, p.y-12, p.w, 12);

  requestAnimationFrame(loop);
}

/* ========== 控制 ========== */
const hold = (id, k) => {
  const el = document.getElementById(id);
  el.addEventListener('touchstart', e=>{ e.preventDefault(); keys[k]=true; });
  el.addEventListener('touchend', ()=> keys[k]=false);
  el.addEventListener('mousedown', ()=> keys[k]=true);
  el.addEventListener('mouseup', ()=> keys[k]=false);
};
hold('kL','l'); hold('kR','r');
document.getElementById('kJ').addEventListener('touchstart', e=>{ e.preventDefault(); if(p.onG){ p.vy=-11; p.onG=false; } });
document.getElementById('kJ').addEventListener('mousedown', ()=>{ if(p.onG){ p.vy=-11; p.onG=false; } });

/* 键盘 */
addEventListener('keydown', e=>{ if(e.key==='ArrowLeft')keys.l=true; if(e.key==='ArrowRight')keys.r=true; if(e.key===' '&&p.onG){p.vy=-11;p.onG=false;} });
addEventListener('keyup', e=>{ if(e.key==='ArrowLeft')keys.l=false; if(e.key==='ArrowRight')keys.r=false; });

/* PWA */
if('serviceWorker' in navigator) navigator.serviceWorker.register('sw.js').catch(()=>{});
</script>
</body>
</html>
